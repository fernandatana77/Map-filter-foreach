<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Tienda Apple</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Mi Tienda Apple</h1>
    
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Buscar producto...">
        <button id="searchBtn">Search</button>
    </div>

    <h2>Productos</h2>
    <div id="productos-lista" class="grid"></div>

    <h2>Productos más caros (> 500)</h2>
    <div id="productos-caros" class="grid"></div>

    <h2>Descuento del 12%</h2>
    <div id="productos-descuento" class="grid"></div>

    <script src="script.js"></script>
</body>
</html>
